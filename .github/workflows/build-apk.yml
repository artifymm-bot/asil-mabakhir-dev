name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "index (1).html"
      - "package.json"
      - "capacitor.config.json"
      - "google-services.json"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Configure Firebase for Android
        run: |
          if [ -f google-services.json ]; then
            cp google-services.json android/app/google-services.json
            python3 - <<'PY'
            from pathlib import Path
            p=Path("android/build.gradle")
            s=p.read_text()
            s=s.replace("com.google.gms:google-services:4.4.4", "com.google.gms:google-services:4.5.0")
            p.write_text(s)
            print("Firebase Android configuration copied and Google Services plugin pinned to 4.5.0.")
            PY
          else
            echo "::warning::google-services.json is not present; APK will build without Firebase Android configuration."
          fi

      - name: Verify source commit
        run: |
          echo "Building commit: $GITHUB_SHA"
          grep -q "nativeRoleGate" "index (1).html"
          grep -q "cap?.Plugins?.Filesystem" "index (1).html"

      - name: Sync web app
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK output
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: asil-mabakhir-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
